synthesis.inputs:
  top_module: "top_3x3"
  input_files:
    - "top_3x3.sv"
    - "./hardware/src/conv_filter_top.sv"
    - "./hardware/src/convolution_core.sv"
    - "./hardware/src/io_control_fsm.sv"
    - "./hardware/src/kernel_register_array.sv"
    - "./hardware/src/normalization_register.sv"
    - "./hardware/src/normalize_clamp.sv"
    - "./hardware/src/sliding_window.sv"
    - "./hardware/src/window_dot_product.sv"
    - "./hardware/src/window_dot_product_generic.sv"
    - "./hardware/src/window_dot_product_5x5.sv"

