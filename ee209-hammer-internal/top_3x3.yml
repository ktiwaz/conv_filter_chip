vlsi.inputs.clocks:
  - name: "clk"
    period: "10ns"
    path: "clk"

par.power_straps_mode: generate
par.generate_power_straps_method: by_tracks
par.generate_power_straps_options:
  by_tracks:
    track_width: 2
    power_utilization: 0.3
    strap_layers:
      - METAL2
      - METAL3
      - METAL4
      - METAL5
      - METAL6
