synthesis.inputs:
  top_module: "top_3x3"
  input_files:
    - "top_3x3.sv"
    - "../hardware/src/conv_filter_top.sv"
    - "../hardware/src/convolution_core.sv"
    - "../hardware/src/io_control_fsm.sv"
    - "../hardware/src/kernel_register_array.sv"
    - "../hardware/src/normalization_register.sv"
    - "../hardware/src/normalize_clamp.sv"
    - "../hardware/src/sliding_window.sv"
    - "../hardware/src/window_dot_product.sv"
    - "../hardware/src/window_dot_product_generic.sv"
    - "../hardware/src/window_dot_product_5x5.sv"

  supplies:
    power: [{name: "VDD", pin: "VDD"}]
    ground: [{name: "VSS", pin: "VSS"}]
    VDD: "1.8 V"
    GND: "0 V"

vlsi.inputs.clocks:
  - name: clk
    period: 10 ns
    uncertainty: 0.1 ns

vlsi.inputs.delays:
  # Inputs relative to clk
  - name: reset_n
    clock: clk
    direction: input
    delay: 1 ns

  - name: kernel_valid
    clock: clk
    direction: input
    delay: 1 ns

  - name: pixel_valid
    clock: clk
    direction: input
    delay: 1 ns

  - name: normalization_valid
    clock: clk
    direction: input
    delay: 1 ns

  - name: test_mode
    clock: clk
    direction: input
    delay: 1 ns

  - name: datain
    clock: clk
    direction: input
    delay: 1 ns

  # Outputs relative to clk
  - name: output_valid
    clock: clk
    direction: output
    delay: 1 ns

  - name: dataout
    clock: clk
    direction: output
    delay: 1 ns

  - name: status
    clock: clk
    direction: output
    delay: 1 ns
  
vlsi.inputs.decaps:
    - target: capacitance
      capacitance: 10 pF

vlsi.inputs.custom_sdc_constraints:
  - "set_false_path -from [get_ports {reset_n}] -to [get_pins {conv_filter_top_inst/rst_sync_reg[0]/CDN conv_filter_top_inst/rst_sync_reg[1]/CDN conv_filter_top_inst/rst_sync_reg[2]/CDN}]"
